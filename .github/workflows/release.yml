# Release CI — runs on the PUBLIC GitHub mirror only (Societus/monopsony).
# Forgejo (base.societus.club) is an internal instance behind forward auth and
# cannot host curl|bash downloads; the installer's DOWNLOAD_BASE points at
# GitHub Releases.
#
# Asset contract (dist/install.sh):
#   monopsony-server-v<VERSION>-{linux-x86_64,linux-aarch64,darwin-arm64,darwin-x86_64}.tar.gz
#   monopsony-client-v<VERSION>-{linux-x86_64,linux-aarch64,darwin-arm64,darwin-x86_64}.tar.gz
#   SHA256SUMS (+ SHA256SUMS.sig when GPG secrets are configured)
# VERSION omits the leading "v"; the release tag carries it.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
          # Both darwin targets build on the arm64 runner; Apple clang
          # cross-compiles x86_64 out of the box.
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain + protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Configure musl linker
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-musl]
          linker = "musl-gcc"
          [target.aarch64-unknown-linux-musl]
          linker = "musl-gcc"
          EOF

      # Reads the pinned channel from rust-toolchain.toml; only the extra
      # matrix target (darwin arch / aarch64) needs adding on top.
      - uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard (rust-embed requires dashboard/build/)
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Build release binaries
        run: cargo build --release --locked -p monopsony-server -p monopsony-client --target ${{ matrix.target }}

      - name: Package tarballs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            */*) VERSION="0.0.0-dev" ;;   # workflow_dispatch from a branch
          esac
          STAGE="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release"
          mkdir -p release
          # Server tarball: binary + init templates + config examples.
          tar czf "release/monopsony-server-v${VERSION}-${{ matrix.platform }}.tar.gz" \
            -C "$STAGE" monopsony-server \
            -C "${GITHUB_WORKSPACE}/dist" \
              init monopsony-tmpfiles.conf monopsony-sysusers.conf \
              server.toml.example mirrors.toml.example
          # Client tarball: binary only.
          tar czf "release/monopsony-client-v${VERSION}-${{ matrix.platform }}.tar.gz" \
            -C "$STAGE" monopsony-client
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: >-
      github.server_url == 'https://github.com'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/*.tar.gz release/
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          ls -la

      - name: Sign SHA256SUMS
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          cd release
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --detach-sign --armor SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading with --clobber."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Monopsony ${TAG}" \
              --notes "See [CHANGELOG.md](CHANGELOG.md) for details.

          Built with the rustc version pinned in rust-toolchain.toml, --locked. Linux builds are musl-static (Alpine-compatible); darwin builds are native per-arch.

          Verify: \`gpg --verify SHA256SUMS.sig SHA256SUMS\` (signature present when the release key is configured)."
          fi
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
