name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: landhunter
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-rust
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /root/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build dashboard (rust-embed requires dashboard/build/)
        run: |
          cd dashboard
          npm ci
          npm run build
      - run: cargo check --workspace --locked

  test:
    name: Test
    runs-on: landhunter
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-rust
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /root/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build dashboard (rust-embed requires dashboard/build/)
        run: |
          cd dashboard
          npm ci
          npm run build
      - run: cargo test --workspace --locked -- --test-threads=1

  clippy:
    name: Clippy
    runs-on: landhunter
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-rust
        with:
          components: clippy
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /root/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build dashboard (rust-embed requires dashboard/build/)
        run: |
          cd dashboard
          npm ci
          npm run build
      - run: cargo clippy --workspace --locked -- -D warnings

  build-x86_64:
    name: Build (x86_64 musl)
    runs-on: landhunter
    timeout-minutes: 60
    needs: [check, test, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-rust
        with:
          target: x86_64-unknown-linux-musl
      - name: Build dashboard (rust-embed requires dashboard/build/)
        run: |
          cd dashboard
          npm ci
          npm run build
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package release artifacts
        run: |
          mkdir -p dist-out
          cp target/x86_64-unknown-linux-musl/release/monopsony-server dist-out/
          cp target/x86_64-unknown-linux-musl/release/monopsony-client dist-out/
          cp target/x86_64-unknown-linux-musl/release/monopsony-tracker dist-out/
          cp dist/monopsony-server.service dist-out/
          cp dist/monopsony-client.service dist-out/
          cp dist/monopsony-server.openrc dist-out/
          cp dist/monopsony-tmpfiles.conf dist-out/
          cp dist/monopsony-sysusers.conf dist-out/
          cp dist/server.toml.example dist-out/
          cp dist/mirrors.toml.example dist-out/
          cd dist-out && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v3
        with:
          name: monopsony-x86_64-musl
          path: dist-out/

  build-aarch64:
    name: Build (aarch64 musl)
    runs-on: landhunter
    timeout-minutes: 60
    needs: [check, test, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-rust
        with:
          target: aarch64-unknown-linux-musl
      - name: Build dashboard (rust-embed requires dashboard/build/)
        run: |
          cd dashboard
          npm ci
          npm run build
      - name: Install cross-compilation toolchain
        run: apk add --no-cache gcc-aarch64-none-elf
      - name: Configure cargo for aarch64 cross-compilation
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-none-elf-gcc"
          EOF
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Package release artifacts
        run: |
          mkdir -p dist-out
          cp target/aarch64-unknown-linux-musl/release/monopsony-server dist-out/
          cp target/aarch64-unknown-linux-musl/release/monopsony-client dist-out/
          cp target/aarch64-unknown-linux-musl/release/monopsony-tracker dist-out/
          cp dist/monopsony-server.service dist-out/
          cp dist/monopsony-client.service dist-out/
          cp dist/monopsony-server.openrc dist-out/
          cp dist/monopsony-tmpfiles.conf dist-out/
          cp dist/monopsony-sysusers.conf dist-out/
          cp dist/server.toml.example dist-out/
          cp dist/mirrors.toml.example dist-out/
          cd dist-out && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v3
        with:
          name: monopsony-aarch64-musl
          path: dist-out/

  sbom:
    name: Generate SBOM
    runs-on: landhunter
    timeout-minutes: 60
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.forgejo/actions/setup-rust
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - run: cargo cyclonedx --all --format json --describe binaries
      - uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: "**/*.cdx.json"

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: landhunter
    timeout-minutes: 60
    needs: [build-x86_64, build-aarch64, sbom]
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${FORGE_REF_NAME:-${GITHUB_REF_NAME:-}}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          mkdir -p release
          tar czf "release/monopsony-${VERSION}-linux-x86_64.tar.gz" -C artifacts/monopsony-x86_64-musl .
          tar czf "release/monopsony-${VERSION}-linux-aarch64.tar.gz" -C artifacts/monopsony-aarch64-musl .

          # Copy SBOM
          find artifacts/sbom -name '*.cdx.json' -exec cp {} release/ \;

          # Generate combined SHA256SUMS
          cd release
          sha256sum \
            "monopsony-${VERSION}-linux-x86_64.tar.gz" \
            "monopsony-${VERSION}-linux-aarch64.tar.gz" > SHA256SUMS
          for f in *.json; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS
          done

      - name: Create Release
        uses: actions/forgejo-release@v2.12.0
        with:
          direction: upload
          tag: ${{ env.VERSION }}
          release-dir: release/
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-notes: |
            See [CHANGELOG.md](CHANGELOG.md) for details.
            Built with rustc stable, --locked, musl static (Alpine).
            SHA256SUMS signed with GPG. Verify: `gpg --verify SHA256SUMS.sig SHA256SUMS`

  build-darwin:
    name: Check (macOS arm64, best-effort)
    runs-on: macos-arm64
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ensure dashboard/build exists (rust-embed needs the dir at compile time)
        run: mkdir -p dashboard/build
      - name: Ensure Rust toolchain (rustup + clippy)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup component add clippy
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked -- --test-threads=1

  swift-selftest:
    name: Swift selftest (macOS arm64, best-effort)
    runs-on: macos-arm64
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build menu-bar app (CLT-only, zero deps)
        run: |
          cd clients/macos
          swift build
      - name: Pure-logic selftest (CLT has no XCTest)
        run: |
          cd clients/macos
          ./.build/debug/MonopsonyMenuBar --selftest
      - name: Client crate still compiles on macOS
        run: |
          mkdir -p dashboard/build
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo check -p monopsony-client --locked
