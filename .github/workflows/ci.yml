name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # protoc needed for tonic-build
  PROTOC: /usr/local/bin/protoc

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --test-threads=1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  build-linux:
    name: Build (x86_64 musl)
    runs-on: ubuntu-latest
    needs: [check, test, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools and protoc
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package release artifacts
        run: |
          mkdir -p dist-out
          cp target/x86_64-unknown-linux-musl/release/monopsony-server dist-out/
          cp target/x86_64-unknown-linux-musl/release/monopsony-client dist-out/
          cp target/x86_64-unknown-linux-musl/release/monopsony-tracker dist-out/
          cp dist/monopsony-server.service dist-out/
          cp dist/monopsony-client.service dist-out/
          cp dist/monopsony-server.openrc dist-out/
          cp dist/monopsony-tmpfiles.conf dist-out/
          cp dist/monopsony-sysusers.conf dist-out/
          cp dist/server.toml.example dist-out/
          cp dist/mirrors.toml.example dist-out/
          cd dist-out && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: monopsony-x86_64-musl
          path: dist-out/
