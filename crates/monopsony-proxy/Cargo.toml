[package]
name = "monopsony-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monopsony-common = { path = "../monopsony-common" }
sqlx = { workspace = true }
monopsony-control = { path = "../monopsony-control" }
monopsony-db = { path = "../monopsony-db" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true, features = ["macros"] }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { version = "0.27", features = ["http2"] }
http-body-util = "0.1"
reqwest = { workspace = true, features = ["json"] }
flate2 = "1"
futures = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
parking_lot = "0.12"
object_store = { version = "0.12", features = ["aws"] }
percent-encoding = "2"
url = "2"
mime_guess = "2"
chrono = { workspace = true }
bytes = "1"
tar = "0.4"
clamav-client = { version = "2.2", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", features = ["ring"] }
monopsony-client = { path = "../monopsony-client" }