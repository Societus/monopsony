[workspace]
resolver = "2"
members = [
    "crates/monopsony-common",
    "crates/monopsony-db",
    "crates/monopsony-proxy",
    "crates/monopsony-control",
    "crates/monopsony-mirror",
    "crates/monopsony-shadow",
    "crates/monopsony-server",
    "crates/monopsony-client",
    "crates/monopsony-tracker",
    "crates/monopsony-admin",
]

[workspace.package]
version = "1.0.0-rc1"
edition = "2021"
license = "MIT"
repository = "https://base.societus.club/societus/monopsony"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = "0.7"
tower = "0.5"
tower-http = "0.6"
hyper = { version = "1", features = ["full"] }
hyper-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"

# Database
# sqlx 0.8 has a future-incompat warning with libsqlite3-sys (via rusqlite 0.31).
# Tracked upstream. Will resolve when sqlx 0.9 is stable. No action needed for RC.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }

# Discovery
mdns-sd = "0.11"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }

# Utilities
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
serde_path_to_error = "0.1"
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"
tokio-cron-scheduler = "0.13"

# Auth / Identity
ed25519-dalek = { version = "2", features = ["serde"] }
jsonwebtoken = "9"

# Build dependencies
tonic-build = "0.12"

# Internal crates
monopsony-common = { path = "crates/monopsony-common" }

# Dashboard / Admin
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"
bcrypt = "0.16"
tower-cookies = "0.10"
