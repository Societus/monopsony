syntax = "proto3";

package monopsony;

// Main control plane service with bidirectional streaming
service MonopsonyControl {
    // Bidirectional stream for control plane communication
    rpc ControlStream(stream ClientMessage) returns (stream ServerMessage);
    
    // Unary RPCs for specific operations
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc ReportInventory(InventoryReport) returns (InventoryResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

    // Shadow package management
    rpc ListShadowPackages(ListShadowPackagesRequest) returns (ShadowPackageList);
    rpc RegisterShadowPackage(RegisterShadowPackageRequest) returns (ShadowPackageInfo);
    rpc UnregisterShadowPackage(UnregisterShadowPackageRequest) returns (UnregisterShadowPackageResponse);
    rpc CheckShadowUpdates(CheckShadowUpdatesRequest) returns (ShadowUpdateList);
    rpc ApplyShadowUpdate(ApplyShadowUpdateRequest) returns (ShadowUpdateResult);
    rpc RollbackShadowUpdate(RollbackShadowUpdateRequest) returns (ShadowUpdateResult);
    rpc GetShadowRecipe(GetShadowRecipeRequest) returns (SignedShadowRecipe);
    rpc DownloadShadowAsset(DownloadShadowAssetRequest) returns (stream ShadowAssetChunk);

    // Server-global recipe catalog (Sprint 22 Phase C, tracker-shaped edges)
    rpc ListShadowCatalog(ListShadowCatalogRequest) returns (ShadowCatalog);
    rpc ReportShadowScan(ShadowScanReport) returns (ShadowScanAck);
}

// Client -> Server messages (for streaming)
message ClientMessage {
    oneof msg {
        RegisterRequest register = 1;
        HeartbeatRequest heartbeat = 2;
        InventoryReport inventory = 3;
        InventoryDelta delta = 4;
        TamperAlert tamper_alert = 5;
    }
}

// Server -> Client messages (for streaming)
message ServerMessage {
    oneof msg {
        RegisterResponse register = 1;
        Command command = 2;
        SyncRequest sync_request = 3;
    }
}

message RegisterRequest {
    string hostname = 1;
    string os = 2;
    string os_version = 3;
    repeated string package_managers = 4;
}

message RegisterResponse {
    string client_id = 1;
    repeated string enabled_managers = 2;
    bytes client_cert_pem = 3;  // Issued client certificate
    bytes client_key_pem = 4;   // Issued client private key
    string ca_cert_pem = 5;     // CA certificate for verification
    bytes mirror_verify_key = 6; // Ed25519 verifying key for pin attestations — re-delivered on every register so already-paired clients rotate without re-pairing
}

// Client → server: served object hash did not match its signed pin (Sprint 20 Phase 3).
message TamperAlert {
    string url = 1;                 // canonical cache URL
    string expected_sha256 = 2;     // hex, from the pin
    string actual_sha256 = 3;       // hex, computed by the client while streaming
    string detail = 4;              // human-readable context (source URL class, policy)
    int64 observed_at = 5;          // unix seconds
}

message HeartbeatRequest {
    string client_id = 1;
    int64 timestamp = 2;
}

message HeartbeatResponse {
    int64 server_time = 1;
}

message InventoryReport {
    string client_id = 1;
    repeated PackageEntry packages = 2;
    bool full_sync = 3;  // true = complete inventory, false = partial
}

message InventoryResponse {
    bool accepted = 1;
    string message = 2;
}

message InventoryDelta {
    string client_id = 1;
    repeated PackageEntry added = 2;
    repeated string removed = 3;  // package IDs
}

message PackageEntry {
    string manager = 1;
    string name = 2;
    string version = 3;
    string arch = 4;
    int64 installed_at = 5;    // epoch seconds (0 = unknown)
    string install_source = 6; // "proxy", "direct", or "" (unknown)
}

message Command {
    enum CommandType {
        RESYNC = 0;
        UPDATE_CONFIG = 1;
        RESTART = 2;
    }
    CommandType type = 1;
    map<string, string> params = 2;
}

message SyncRequest {
    // Server requests full inventory resync
}

// Pairing messages (exchanged over plaintext pairing port 50052)
message PairRequest {
    string code = 1;                    // 6-char alphanumeric pairing code
    string hostname = 2;
    string os = 3;
    string os_version = 4;
    repeated string package_managers = 5;
}

message PairResponse {
    string client_id = 1;
    bytes client_cert_pem = 2;
    bytes client_key_pem = 3;
    bytes ca_cert_pem = 4;
    string grpc_addr = 5;               // Server gRPC address for future mTLS connections
    string ws_url = 6;                  // WebSocket tunnel URL (wss://host/ws/tunnel) for clients behind CF/proxy
    bytes mirror_verify_key = 7;        // Ed25519 verifying key (32 bytes) for pin attestations (Sprint 20 Phase 3)
}

// Mirror management RPCs
service MirrorControl {
    // List all configured mirrors and their status
    rpc ListMirrors(ListMirrorsRequest) returns (ListMirrorsResponse);
    // Trigger immediate sync for a specific distro mirror
    rpc TriggerMirrorSync(TriggerMirrorSyncRequest) returns (TriggerMirrorSyncResponse);
    // Get detailed status for a single mirror
    rpc GetMirrorStatus(GetMirrorStatusRequest) returns (GetMirrorStatusResponse);
    // Add or update a mirror configuration
    rpc UpsertMirrorConfig(UpsertMirrorConfigRequest) returns (UpsertMirrorConfigResponse);
    // Remove a mirror configuration
    rpc DeleteMirrorConfig(DeleteMirrorConfigRequest) returns (DeleteMirrorConfigResponse);
}

message MirrorInfo {
    string distro = 1;
    string upstream_url = 2;
    string local_path = 3;
    bool sync_enabled = 4;
    int64 sync_interval_secs = 5;
    int64 bandwidth_limit_bps = 6;
    repeated string include_patterns = 7;
    repeated string exclude_patterns = 8;
    bool public = 9;
    int64 last_sync = 10;           // epoch seconds, 0 = never
    string sync_status = 11;        // "idle", "syncing", "error: ..."
    int64 total_bytes = 12;
}

message ListMirrorsRequest {}

message ListMirrorsResponse {
    repeated MirrorInfo mirrors = 1;
}

message TriggerMirrorSyncRequest {
    string distro = 1;
}

message TriggerMirrorSyncResponse {
    bool triggered = 1;
    string message = 2;
}

message GetMirrorStatusRequest {
    string distro = 1;
}

message GetMirrorStatusResponse {
    MirrorInfo mirror = 1;
}

message UpsertMirrorConfigRequest {
    string distro = 1;
    string upstream_url = 2;
    string local_path = 3;
    bool sync_enabled = 4;
    int64 sync_interval_secs = 5;
    int64 bandwidth_limit_bps = 6;
    repeated string include_patterns = 7;
    repeated string exclude_patterns = 8;
    bool public = 9;
}

message UpsertMirrorConfigResponse {
    bool created = 1;
    string message = 2;
}

message DeleteMirrorConfigRequest {
    string distro = 1;
}

message DeleteMirrorConfigResponse {
    bool deleted = 1;
    string message = 2;
}

// ── Shadow Package Messages ──

message ListShadowPackagesRequest {
    string client_id = 1;
}

message ShadowPackageInfo {
    string id = 1;
    string name = 2;
    string version = 3;
    string architecture = 4;
    string os_family = 5;
    string libc = 6;
    string source_type = 7;
    string source_url = 8;
    string recipe_path = 9;
    repeated string install_paths = 10;
    repeated string config_paths = 11;
    string service_name = 12;
    string masked_from_pm = 13;
    int64 registered_at = 14;
    int64 last_updated_at = 15;
    int64 last_checked_at = 16;
}

message ShadowPackageList {
    repeated ShadowPackageInfo packages = 1;
}

message RegisterShadowPackageRequest {
    string client_id = 1;
    string name = 2;
    string version = 3;
    string architecture = 4;
    string os_family = 5;
    string libc = 6;
    string source_type = 7;
    string source_url = 8;
    string recipe_toml = 9;
    repeated string install_paths = 10;
    repeated string config_paths = 11;
    string service_name = 12;
    bool mask_from_pm = 13;
}

message UnregisterShadowPackageRequest {
    string client_id = 1;
    string package_id = 2;
    bool unmask_from_pm = 3;
}

message UnregisterShadowPackageResponse {
    bool deleted = 1;
    string message = 2;
}

message CheckShadowUpdatesRequest {
    string client_id = 1;
    repeated string package_ids = 2; // empty = check all
}

message ShadowUpdateInfo {
    string package_id = 1;
    string package_name = 2;
    string current_version = 3;
    string latest_version = 4;
    string asset_url = 5;
    string asset_name = 6;
    int64 asset_size = 7;
    string release_notes_url = 8;
}

message ShadowUpdateList {
    repeated ShadowUpdateInfo updates = 1;
}

message ApplyShadowUpdateRequest {
    string client_id = 1;
    string package_id = 2;
    string target_version = 3;
    string asset_url = 4;
    bool create_backup = 5;
}

message RollbackShadowUpdateRequest {
    string client_id = 1;
    string package_id = 2;
}

message ShadowUpdateResult {
    bool success = 1;
    string message = 2;
    string new_version = 3;
    string backup_path = 4;
}

message GetShadowRecipeRequest {
    string client_id = 1;
    string package_name = 2;
}

message SignedShadowRecipe {
    string recipe_toml = 1;
    string key_id = 2;
    string signature = 3;
    int64 signed_at = 4;
}

message DownloadShadowAssetRequest {
    string client_id = 1;
    string package_id = 2;
    string target_version = 3;
}

message ShadowAssetChunk {
    bytes data = 1;
    int64 offset = 2;
    int64 total_size = 3;
    string blob_hash = 4;
}

// ── Shadow Recipe Catalog (Sprint 22 Phase C) ──

message ListShadowCatalogRequest {
    string client_id = 1;
    string catalog_hash = 2; // client's current hash; empty = full pull
}

message ShadowCatalogEntry {
    string name = 1;
    string recipe_toml = 2;
    string signature = 3;    // server recipe key Ed25519 over canonical JSON
    string key_id = 4;
    string catalog_hash = 5; // sha256 of canonical JSON of this entry's {name, recipe_toml}
    int64 published_at = 6;
    string provenance_client_id = 7;
}

message ShadowCatalog {
    string catalog_hash = 1;              // hash of the whole catalog (change detection)
    repeated ShadowCatalogEntry entries = 2;
}

message ShadowScanReport {
    string client_id = 1;
    string catalog_hash = 2;              // the catalog version the scan ran against
    repeated ShadowScanFinding findings = 3;
}

message ShadowScanFinding {
    string recipe_name = 1;
    bool installed = 2;
    string detected_version = 3; // empty when not installed / undetected
    string method = 4;           // "install_path" | "detect_command"
}

message ShadowScanAck {
    bool accepted = 1;
    string message = 2;
}