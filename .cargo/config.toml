# Cross-compilation settings for native (non-cross) builds.
# This lets us build Windows and FreeBSD targets directly with cargo
# instead of needing the `cross` Docker images (which are outdated).

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"

[target.x86_64-unknown-freebsd]
linker = "x86_64-unknown-freebsd13-gcc"
ar = "x86_64-unknown-freebsd13-ar"
