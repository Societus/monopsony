[build.env]
passthrough = ["PROTOC"]

[target.x86_64-unknown-freebsd]
pre-build = [
  "apt-get update -qq && apt-get install -yqq wget unzip",
  "curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v29.5/protoc-29.5-linux-x86_64.zip -o /tmp/protoc.zip",
  "unzip -o /tmp/protoc.zip -d /usr/local bin/protoc include/*",
  "chmod +x /usr/local/bin/protoc",
  "rm /tmp/protoc.zip",
]
